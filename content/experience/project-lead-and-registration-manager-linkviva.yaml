highlights:
  - "Project Coordinator for the Sheikh Zayed Summer Festival, a large-scale cultural and entertainment festival delivered by LINKVIVA."
  - "Supporting end-to-end planning, coordination, and execution of the festival from pre-production through live delivery and post-event closeout, ensuring timelines, project milestones, and operational requirements were achieved across all workstreams."
  - "Coordinating with internal teams, suppliers, venues, and stakeholders to manage project requirements, logistics, approvals, and day-to-day communications throughout the festival lifecycle."
  - "Maintaining project documentation, including schedules, action trackers, meeting minutes, budgets, permits, and operational reports, ensuring full visibility and accountability across all project workstreams."
  - "Supporting onsite event delivery by coordinating vendors, monitoring progress, resolving issues in real time, and ensuring smooth execution across all festival zones and activations."
  - "Tracking project timelines, budgets, and deliverables, proactively identifying risks, and supporting the Project Director in ensuring the successful delivery of the festival."
  - "Served as Registration Manager, overseeing daily entry and exit for up to 2,000 attendees, ensuring all guests were badged and categorized by age and gender, verifying correct group placement against eligibility criteria, and managing the on-ground registration team."
  - "Coordinated with the transportation team to ensure safe boarding and accurate group allocation of attendees, including children, across a fleet of 200 buses, and acted as on-ground Operations Coordinator liaising between the client and operations team."
